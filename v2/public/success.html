<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mensagem enviada · Akemi</title>
  <meta name="description" content="Sua mensagem foi enviada com sucesso." />
  <meta name="theme-color" content="#fffbfc" />
  <meta name="color-scheme" content="light" />

  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="icon" type="image/png" href="assets/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="assets/favicon-48.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .success-card {
      width: min(22rem, 100%);
      padding: var(--spacing-xl) var(--spacing-md);
      transform: rotate(-0.6deg);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--spacing-sm);
      text-align: center;
    }

    .success-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 3rem;
      height: 3rem;
      border-radius: 50%;
      background: var(--color-white);
      box-shadow: var(--sticker-badge-shadow);
      color: var(--color-primary-deep);
      font-size: 1.4rem;
    }

    .success-card h1 {
      font-size: var(--font-size-display);
      font-weight: var(--font-weight-display);
      color: var(--color-ink);
      margin: 0;
    }

    .success-card p {
      font-size: var(--font-size-body);
      line-height: var(--line-height-body);
      color: var(--color-ink-soft);
      margin: 0;
      max-width: 32ch;
    }
  </style>
</head>
<body>
  <div class="stage">
    <span class="decor-sparkle decor-sparkle--1" aria-hidden="true">✦</span>
    <span class="decor-sparkle decor-sparkle--2" aria-hidden="true">✦</span>
    <span class="decor-sparkle decor-sparkle--3" aria-hidden="true">✦</span>

    <main class="sticker-card success-card" aria-labelledby="success-title">
      <span class="success-mark" aria-hidden="true">✓</span>
      <h1 id="success-title">Mensagem enviada!</h1>
      <p>Obrigada por escrever — sua mensagem chegou e vou ler em breve.</p>
      <a class="btn btn-primary" href="./index.html">Voltar ao perfil</a>
    </main>
  </div>
</body>
</html>
